<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — CareerHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
         ========================= -->

    <header class="navbar">

        <div class="navbar-inner">

            <a href="index.html" class="logo">
                <span class="logo-mark">C</span>
                <span>CareerHub</span>
            </a>

            <nav class="nav-links">

                <a href="index.html">Home</a>

                <a href="jobs.html">Find Jobs</a>

                <a href="#">Companies</a>

                <a href="#">Career Resources</a>

            </nav>

            <div class="nav-actions">

                <a href="login.html" class="btn btn-secondary">
                    Log in
                </a>

            </div>

        </div>

    </header>


    <!-- =========================
         REGISTER PAGE
         ========================= -->

    <main class="auth-page">

        <div class="register-container">

            <div class="auth-header">

                <h1>Create your account</h1>

                <p>
                    Join CareerHub and take the next step in your career.
                </p>

            </div>


            <div class="auth-card">

                <form>


                    <!-- ACCOUNT TYPE -->

                    <div class="form-group">

                        <label>
                            I am joining as
                        </label>

                        <div class="role-options">

                            <label class="role-option">

                                <input type="radio" name="role" value="job-seeker" checked>

                                <span class="role-content">

                                    <strong>Job Seeker</strong>

                                    <small>
                                        Looking for job opportunities
                                    </small>

                                </span>

                            </label>


                            <label class="role-option">

                                <input type="radio" name="role" value="employer">

                                <span class="role-content">

                                    <strong>Employer</strong>

                                    <small>
                                        Looking to hire talent
                                    </small>

                                </span>

                            </label>

                        </div>

                    </div>


                    <!-- NAME -->

                    <div class="form-row">

                        <div class="form-group">

                            <label for="first-name">
                                First name
                            </label>

                            <input type="text" id="first-name" name="firstName" placeholder="First name"
                                autocomplete="given-name" required>

                        </div>


                        <div class="form-group">

                            <label for="last-name">
                                Last name
                            </label>

                            <input type="text" id="last-name" name="lastName" placeholder="Last name"
                                autocomplete="family-name" required>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="register-email">
                            Email address
                        </label>

                        <input type="email" id="register-email" name="email" placeholder="you@example.com"
                            autocomplete="email" required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="register-password">
                            Password
                        </label>

                        <input type="password" id="register-password" name="password" placeholder="Create a password"
                            autocomplete="new-password" required>

                        <small class="input-hint">
                            Use at least 8 characters.
                        </small>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm password
                        </label>

                        <input type="password" id="confirm-password" name="confirmPassword"
                            placeholder="Re-enter your password" autocomplete="new-password" required>

                    </div>


                    <!-- TERMS -->

                    <div class="checkbox-row terms-row">

                        <input type="checkbox" id="terms" name="terms" required>

                        <label for="terms">

                            I agree to the
                            <a href="#">Terms of Service</a>
                            and
                            <a href="#">Privacy Policy</a>.

                        </label>

                    </div>


                    <!-- CREATE ACCOUNT -->

                    <button type="submit" class="btn btn-primary btn-full">

                        Create account

                    </button>

                </form>


                <!-- LOGIN -->

                <p class="auth-footer-text">

                    Already have an account?

                    <a href="login.html">
                        Log in
                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <span>
                    © 2026 CareerHub. All rights reserved.
                </span>

                <span>
                    Your information is kept secure.
                </span>

            </div>

        </div>

    </footer>
    <!-- JAVASCRIPT -->
    <script src="js/api.js"></script>
    <script src="script.js"></script>

</body>

</html>
