<!DOCTYPE html>
<html>

<head>
    <title>CareerHub Password Reset</title>
</head>

<body>

    <h2>CareerHub Password Reset</h2>

    <button onclick="resetPassword()">
        Reset Arjun Password
    </button>

    <p id="message"></p>

    <script>

        async function resetPassword() {

            const password = prompt(
                "Apna current password enter karo:"
            );

            if (!password) {
                return;
            }

            const response = await fetch(
                "http://localhost:8080/api/users/reset-password?email=arjunsainidnk@gmail.com&newPassword=" +
                encodeURIComponent(password),
                {
                    method: "POST"
                }
            );

            const result =
                await response.text();

            document.getElementById("message")
                .textContent = result;
        }

    </script>

</body>

</html>
